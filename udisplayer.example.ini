# udisplayer — example server configuration
# Use: python3 server.py --config /path/to/udisplayer.ini
# Strict key = value format (no sections or quoted values).
# CLI options override corresponding INI values. All fields are optional.

host = 0.0.0.0
port = 8081
path = /

# Relative channel-list paths are resolved against server.py's directory
# (or the executable directory for a packaged Linux release), NOT this INI.
channel-list = channels.json

# FFmpeg and GPU; omit to search PATH and auto-select a DRM Render Node.
# ffmpeg = /usr/bin/ffmpeg
# hw-render = /dev/dri/renderD128
# hw-render = none

max-streams = 4
# decoder-threads = 4
# encoder-threads = 4

startup-timeout = 30
# Web 心跳及直接 HLS 取流共用的閒置期限（秒）。
idle-timeout = 20
# cache-dir = /var/cache/udisplayer

debug = false
